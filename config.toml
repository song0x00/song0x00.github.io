base_url = "https://songbird.rip"
title = "songbird"
description = "red team & wireless security — write-ups, tooling notes and things that broke in interesting ways"
default_language = "en"
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
    { name = "tags", feed = false },
]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 4000

[extra]
# shell-prompt identity used across the site: "<visitor>@<host>" and the about terminal's "<owner>@<host>"
prompt_visitor = "guest"
prompt_owner = "song"
prompt_host = "tty1"
# Shown in the nav + footer. Change freely.
site_glyph = "●"
# big dot-matrix name on the home page (a dot-matrix ♪ is drawn after it)
wordmark = "song"
role = "red team & wireless"
tagline = "red teamer. wireless researcher. tool builder. a running log of research, tooling notes and things that broke in interesting ways."

# home-page "local time" tile (IANA zone name)
timezone = "Europe/London"
# home-page typing tile: types each line, deletes it, moves to the next, loops forever.
# drafts — swap these for your own.
ticker = [
  "hi, im song",
  "cat aboutme.txt",
  "red teamer. wireless researcher.",
  "building tools in python & rust.",
  "tail -f /var/log/signal",
]

[markdown.highlighting]
style = "class"
# only used for its class slots — colours come from static/style.css
theme = "github-dark"
