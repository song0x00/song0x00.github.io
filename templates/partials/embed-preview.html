{# dev-only: included from base.html when config.mode == "serve". Never ships in `zola build`. #}
<button type="button" class="dev-embed-btn" title="preview link embed (dev only)">preview embed</button>
<style>
  .dev-embed-btn {
    position: fixed; left: 16px; bottom: 16px; z-index: 110;
    font: 10px var(--font-mono); letter-spacing: .14em; text-transform: uppercase;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    background: var(--panel); color: var(--fg); border: 1px dashed var(--accent);
  }
  .dev-embed-btn:hover { color: var(--fg-hi); border-style: solid; }
  .dev-embed { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 16px;
    background: rgba(0,0,0,.75); backdrop-filter: blur(3px); overflow-y: auto; text-shadow: none; }
  .dev-embed-inner { width: min(980px, 100%); display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; }
  .dev-embed h3 { grid-column: 1 / -1; font: 11px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .dev-embed h3 b { color: var(--fg-hi); font-weight: 400; }
  .dev-pane { border-radius: 14px; padding: 16px; }
  .dev-pane > p { font: 10px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px; opacity: .6; }
  /* chat-app style (Discord-like) */
  .dev-chat { background: #313338; color: #dbdee1; font: 15px/1.375 "gg sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif; }
  .dev-chat .msg-url { color: #00a8fc; word-break: break-all; }
  .dev-chat .card { margin-top: 6px; max-width: 432px; background: #2b2d31; border-radius: 4px; border-left: 4px solid var(--emb-colour); padding: 8px 16px 16px 12px; }
  .dev-chat .site { font-size: 12px; color: #b5bac1; margin-top: 8px; }
  .dev-chat .title { color: #00a8fc; font-weight: 600; margin-top: 8px; }
  .dev-chat .desc { font-size: 14px; margin-top: 8px; color: #dbdee1; }
  .dev-chat img { display: block; width: 100%; border-radius: 4px; margin-top: 16px; }
  /* fediverse style (Mastodon-like) */
  .dev-fedi { background: #191b22; color: #d9e1e8; font: 15px/1.4 Roboto, "Noto Sans", Arial, sans-serif; }
  .dev-fedi .msg-url { color: #8c8dff; word-break: break-all; }
  .dev-fedi .card { margin-top: 12px; border: 1px solid #393f4f; border-radius: 8px; overflow: hidden; }
  .dev-fedi img { display: block; width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; }
  .dev-fedi .body { padding: 12px 14px; }
  .dev-fedi .site { font-size: 13px; color: #9baec8; }
  .dev-fedi .title { font-weight: 700; margin-top: 2px; }
  .dev-fedi .desc { font-size: 14px; color: #9baec8; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dev-warn { grid-column: 1 / -1; font: 12px var(--font-mono); color: #ffb86b; }
  .dev-tags { grid-column: 1 / -1; font: 11px/1.7 var(--font-mono); color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; overflow-x: auto; white-space: pre; }
</style>
<script>
(() => {
  const btn = document.querySelector(".dev-embed-btn");
  const m = n => document.querySelector(`meta[property="${n}"], meta[name="${n}"]`)?.content || "";
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let box = null;
  const close = () => { box?.remove(); box = null; };
  btn.addEventListener("click", () => {
    if (box) return close();
    const d = {
      site: m("og:site_name"), title: m("og:title"), desc: m("og:description"),
      img: m("og:image"), url: m("og:url"), colour: m("theme-color") || "#202225",
    };
    // what the live site will advertise (local serve swaps base_url for localhost)
    const liveUrl = d.url.replace(/^https?:\/\/[^/]+/, "https://songbird.rip");
    const warn = [];
    if (!d.img) warn.push("no og:image — card will have no picture");
    if (d.title.length > 70) warn.push(`title is ${d.title.length} chars — may be cut off`);
    if (d.desc.length > 200) warn.push(`description is ${d.desc.length} chars — chat apps trim around 200–350`);
    box = document.createElement("div");
    box.className = "dev-embed";
    box.innerHTML = `<div class="dev-embed-inner">
      <h3>link preview for <b>${esc(liveUrl)}</b> · approximation · esc to close</h3>
      ${warn.map(w => `<p class="dev-warn">⚠ ${esc(w)}</p>`).join("")}
      <div class="dev-pane dev-chat" style="--emb-colour:${esc(d.colour)}">
        <p>chat app (discord-style)</p>
        <span class="msg-url">${esc(liveUrl)}</span>
        <div class="card">
          <div class="site">${esc(d.site)}</div>
          <div class="title">${esc(d.title)}</div>
          <div class="desc">${esc(d.desc)}</div>
          ${d.img ? `<img src="${esc(d.img)}" alt="">` : ""}
        </div>
      </div>
      <div class="dev-pane dev-fedi">
        <p>fediverse (mastodon-style)</p>
        <span class="msg-url">${esc(liveUrl)}</span>
        <div class="card">
          ${d.img ? `<img src="${esc(d.img)}" alt="">` : ""}
          <div class="body">
            <div class="site">${esc(new URL(liveUrl).host)}</div>
            <div class="title">${esc(d.title)}</div>
            <div class="desc">${esc(d.desc)}</div>
          </div>
        </div>
      </div>
      <div class="dev-tags">${esc([...document.head.querySelectorAll('meta[property^="og:"], meta[property^="article:"], meta[name^="twitter:"], meta[name="theme-color"]')].map(e => e.outerHTML).join("\n"))}</div>
    </div>`;
    box.addEventListener("click", e => { if (e.target === box || e.target.classList.contains("dev-embed-inner")) close(); });
    document.body.appendChild(box);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
})();
</script>
