<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block desc %}{{ config.description }}{% endblock desc %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml') }}">
</head>
<body>
  <div class="crt" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="{{ get_url(path='/') }}">
      <span class="led" aria-hidden="true"></span>
      <span class="brand-name">{{ config.title }}</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a class="pill" href="{{ get_url(path='posts') }}">log</a>
      <a class="pill" href="{{ get_url(path='tags') }}">index</a>
      <a class="pill" href="{{ get_url(path='about') }}">about</a>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock content %}
  </main>

  <footer class="foot">
    <span class="dots" aria-hidden="true"></span>
    <span>{{ config.title }} · signal stable</span>
    <a href="{{ get_url(path='atom.xml') }}">feed</a>
  </footer>
</body>
</html>
